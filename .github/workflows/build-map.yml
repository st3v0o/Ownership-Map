name: Build and publish map

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
  schedule:
    # Monthly, a few days after the City Assessor's mid-month data refresh.
    - cron: "0 9 18 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tippecanoe
        run: sudo apt-get update -q && sudo apt-get install -y -q tippecanoe

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Vendor map libraries
        run: npm ci --no-audit --no-fund && npm run vendor

      - name: Download and classify Richmond parcels
        run: python scripts/build_data.py --out build

      - name: Build vector tiles
        run: |
          scripts/build_tiles.sh build/parcels.ndjson site/data/parcels.pmtiles
          cp build/stats.json site/data/stats.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
